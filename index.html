<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPOS Cloud Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="app-main">
        <!-- Navbar Superior -->
        <nav class="navbar navbar-dark bg-dark shadow-sm py-2">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold fs-6"><i class="fas fa-cash-register me-2"></i>MiniPOS Pro</span>
                <div class="d-flex align-items-center gap-1">
                    <button id="badge-turno" type="button" class="btn btn-warning btn-sm fw-bold text-dark py-1 px-2 shadow-sm" onclick="abrirModalTurno()" style="font-size: 0.75rem;">
                        <i class="fas fa-play-circle me-1"></i>Comenzar Turno
                    </button>
                    <button type="button" class="btn btn-outline-light btn-sm py-0 px-2" onclick="switchTab('pos')"><i class="fas fa-store"></i> Caja</button>
                    <button type="button" class="btn btn-outline-light btn-sm py-0 px-2" onclick="verAdmin()"><i class="fas fa-chart-line"></i> Admin</button>
                </div>
            </div>
        </nav>

        <main class="container py-3">
            <!-- ================= VISTA CAJA (POS) ================= -->
            <div id="view-pos" class="row">
                <div class="col-lg-7 mb-4">
                    <div class="card shadow-sm border-0 mb-3">
                        <div class="card-body p-3 bg-white rounded">
                            <label class="form-label small fw-bold text-muted"><i class="fas fa-barcode me-1"></i>Escáner / Búsqueda de Artículos (SC402)</label>
                            <div class="input-group">
                                <input type="text" id="input-buscar-articulo" class="form-control" placeholder="Pase el código de barras o escriba nombre..." oninput="filtrarCatalogoRapido()" onkeydown="manejarEnterEscanner(event)">
                                <button type="button" class="btn btn-primary fw-bold px-3" onclick="filtrarCatalogoRapido()"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                    </div>

                    <h6 class="fw-bold text-secondary mb-2">Catálogo Rápido</h6>
                    <div class="row row-cols-1 g-2" id="product-grid" style="max-height: 380px; overflow-y: auto;"></div>
                </div>

                <div class="col-lg-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold fs-6"><i class="fas fa-shopping-cart me-2"></i>Venta Actual</h5>
                            <span id="label-cajero-actual" class="badge bg-secondary small">Cajero: Ninguno</span>
                        </div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush" id="cart-items" style="max-height: 200px; overflow-y: auto;">
                                <li class="list-group-item text-center text-muted py-4 small">El carrito está vacío</li>
                            </ul>
                        </div>
                        <div class="card-footer bg-white py-3">
                            <div class="d-flex justify-content-between mb-1 small text-muted">
                                <span>Subtotal:</span>
                                <span id="cart-subtotal">$U 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2 small text-danger">
                                <span>Descuento de Carnicería (10%):</span>
                                <span id="cart-descuento-monto">-$U 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3 border-top pt-2">
                                <span class="fw-bold fs-5">Total a Pagar:</span>
                                <span class="fw-bold fs-5 text-success" id="cart-total">$U 0.00</span>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-success py-2 fw-bold" onclick="cobrarVenta()"><i class="fas fa-check-circle me-2"></i>Cobrar y Facturar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div><!-- ================= VISTA PANEL ADMINISTRATIVO ================= -->
            <div id="view-dashboard" class="row" style="display: none;">
                <div class="col-12 mb-3 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold text-secondary mb-0">Panel de Administración</h5>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="switchTab('pos')"><i class="fas fa-arrow-left me-1"></i>Volver a Caja</button>
                </div>
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-2 fw-bold small">Gestión de Artículos (Base de Datos)</div>
                        <div class="card-body bg-white">
                            <div class="row g-2">
                                <div class="col-3"><input type="number" id="db-code" class="form-control form-control-sm" placeholder="Código"></div>
                                <div class="col-5"><input type="text" id="db-name" class="form-control form-control-sm" placeholder="Nombre"></div>
                                <div class="col-2"><input type="number" step="0.01" id="db-price" class="form-control form-control-sm" placeholder="Precio"></div>
                                <div class="col-2">
                                    <select id="db-cat" class="form-select form-select-sm">
                                        <option value="Carniceria">Carnicería (10%)</option>
                                        <option value="Almacen">Almacén (0%)</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-2">
                                    <button type="button" class="btn btn-primary btn-sm w-100 fw-bold" onclick="guardarEnBaseDatos()"><i class="fas fa-save me-1"></i>Guardar / Actualizar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= MODAL COMIENZO DE TURNO Y CAJERO ================= -->
    <div class="modal fade" id="modalTurno" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title fs-6 fw-bold"><i class="fas fa-play-circle me-2"></i>Comenzar Turno y Selección de Cajero</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Seleccione Horario de Turno</label>
                        <select id="select-horario-turno" class="form-select">
                            <option value="09:00 a 13:00">Turno Mañana (09:00 a 13:00)</option>
                            <option value="17:00 a 21:00">Turno Tarde (17:00 a 21:00)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre del Cajero</label>
                        <input type="text" id="input-cajero-nombre" class="form-control" placeholder="Ingrese nombre del cajero">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">PIN del Cajero</label>
                        <input type="password" id="input-cajero-pin" class="form-control" placeholder="PIN de acceso" maxlength="6">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-success py-2 fw-bold" onclick="iniciarTurnoCajero()">
                            <i class="fas fa-check-circle me-1"></i>Comenzar Turno
                        </button>
                        <button type="button" class="btn btn-primary py-2 fw-bold small" onclick="registrarNuevoCajero()">
                            <i class="fas fa-user-plus me-1"></i>Registrar Nuevo Cajero
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let articulosGuardados = JSON.parse(localStorage.getItem("minipos_articulos")) || [];
            if (articulosGuardados.length === 0) {
                for (let i = 1; i <= 200; i++) {
                    articulosGuardados.push({
                        codigo: i,
                        nombre: `Artículo Carnicería ${i}`,
                        categoria: "Carniceria",
                        precio: (100.00).toFixed(2)
                    });
                }
                localStorage.setItem("minipos_articulos", JSON.stringify(articulosGuardados));
            }

            renderCatalogoRapido();
            renderCart();
        });

        function abrirModalTurno() {
            let modal = new bootstrap.Modal(document.getElementById("modalTurno"));
            modal.show();
        }

        function iniciarTurnoCajero() {
            let horario = document.getElementById("select-horario-turno").value;
            let nombre = document.getElementById("input-cajero-nombre").value.trim();
            let pin = document.getElementById("input-cajero-pin").value.trim();

            if (!nombre || !pin) {
                alert("Por favor complete el nombre y el PIN del cajero.");
                return;
            }

            let cajeros = JSON.parse(localStorage.getItem("minipos_cajeros")) || [];
            let cajeroEncontrado = cajeros.find(c => c.nombre.toLowerCase() === nombre.toLowerCase() && c.pin === pin);

            if (!cajeroEncontrado) {
                alert("Cajero no registrado o PIN incorrecto. Utilice el botón azul para registrarlo.");
                return;
            }

            document.getElementById("label-cajero-actual").innerText = `Cajero: ${cajeroEncontrado.nombre}`;
            document.getElementById("badge-turno").innerHTML = `<i class="fas fa-check-circle me-1"></i>Turno Activo (${horario})`;
            document.getElementById("badge-turno").className = "btn btn-success btn-sm fw-bold text-white py-1 px-2 shadow-sm";

            let modalEl = document.getElementById("modalTurno");
            let modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
            alert(`Turno de ${horario} iniciado correctamente para ${cajeroEncontrado.nombre}.`);
        }

        function registrarNuevoCajero() {
            let nombre = document.getElementById("input-cajero-nombre").value.trim();
            let pin = document.getElementById("input-cajero-pin").value.trim();

            if (!nombre || !pin) {
                alert("Ingrese nombre y PIN para registrar al nuevo cajero.");
                return;
            }

            let cajeros = JSON.parse(localStorage.getItem("minipos_cajeros")) || [];
            let existe = cajeros.some(c => c.nombre.toLowerCase() === nombre.toLowerCase());

            if (existe) {
                alert("Este cajero ya está registrado.");
                return;
            }

            cajeros.push({ nombre, pin });
            localStorage.setItem("minipos_cajeros", JSON.stringify(cajeros));
            alert(`¡Cajero ${nombre} registrado con éxito! Ya puede iniciar turno.`);
        }

        function manejarEnterEscanner(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                procesarCodigoBarras();
            }
        }

        function procesarCodigoBarras() {
            let input = document.getElementById("input-buscar-articulo");
            let codigoLeido = input.value.trim();
            if (!codigoLeido) return;

            let articulos = JSON.parse(localStorage.getItem("minipos_articulos")) || [];
            let articuloEncontrado = null;
            let precioPersonalizado = null;

            if (codigoLeido.length === 13 && codigoLeido.startsWith("2")) {
                let codigoArticulo = parseInt(codigoLeido.substring(1, 6)).toString();
                let valorEtiqueta = parseInt(codigoLeido.substring(6, 12)) / 100;
                articuloEncontrado = articulos.find(art => art.codigo.toString() === codigoArticulo);
                if (articuloEncontrado) precioPersonalizado = valorEtiqueta;
            }

            if (!articuloEncontrado) {
                articuloEncontrado = articulos.find(art => art.codigo.toString() === codigoLeido);
            }

            if (!articuloEncontrado) {
                articuloEncontrado = articulos.find(art => art.nombre.toLowerCase().includes(codigoLeido.toLowerCase()));
            }

            if (articuloEncontrado) {
                agregarAlCarrito(articuloEncontrado.codigo, precioPersonalizado);
                input.value = "";
                input.focus();
            } else {
                alert("Artículo no encontrado en la base de datos.");
            }
        }

        function agregarAlCarrito(codigo, precioOverride = null) {
            let articulos = JSON.parse(localStorage.getItem("minipos_articulos")) || [];
            let articulo = articulos.find(art => art.codigo == codigo);
            if (!articulo) return;

            let carrito = JSON.parse(localStorage.getItem("minipos_carrito")) || [];
            let precioFinal = precioOverride !== null ? precioOverride : parseFloat(articulo.precio);
            let index = carrito.findIndex(item => item.codigo == codigo && item.precioCustom === precioOverride);
            
            if (index > -1 && precioOverride === null) {
                carrito[index].cantidad += 1;
            } else {
                carrito.push({
                    codigo: articulo.codigo,
                    nombre: articulo.nombre,
                    categoria: articulo.categoria || "Carniceria",
                    precio: precioFinal,
                    precioCustom: precioOverride,
                    cantidad: 1
                });
            }

            localStorage.setItem("minipos_carrito", JSON.stringify(carrito));
            renderCart();
        }

        function renderCart() {
            let carrito = JSON.parse(localStorage.getItem("minipos_carrito")) || [];
            let contenedor = document.getElementById("cart-items");
            if (!contenedor) return;
            contenedor.innerHTML = "";

            if (carrito.length === 0) {
                contenedor.innerHTML = `<li class="list-group-item text-center text-muted py-4 small">El carrito está vacío</li>`;
                document.getElementById("cart-subtotal").innerText = "$U 0.00";
                document.getElementById("cart-descuento-monto").innerText = "-$U 0.00";
                document.getElementById("cart-total").innerText = "$U 0.00";
                return;
            }

            let subtotal = 0;
            let descuentoTotal = 0;

            carrito.forEach((item, index) => {
                let totalItem = item.precio * item.cantidad;
                subtotal += totalItem;

                if (item.categoria === "Carniceria") {
                    descuentoTotal += totalItem * 0.10;
                }

                contenedor.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-2 small">
                        <div>
                            <strong>${item.nombre}</strong> <span class="badge bg-success" style="font-size:0.65rem;">${item.categoria}</span><br>
                            <span class="text-muted">${item.cantidad} x $U ${item.precio.toFixed(2)}</span>
                        </div>
                        <div>
                            <span class="fw-bold me-2">$U ${totalItem.toFixed(2)}</span>
                            <button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="eliminarItemCarrito(${index})"><i class="fas fa-times"></i></button>
                        </div>
                    </li>`;
            });

            let totalPagar = subtotal - descuentoTotal;
            document.getElementById("cart-subtotal").innerText = `$U ${subtotal.toFixed(2)}`;
            document.getElementById("cart-descuento-monto").innerText = `-$U ${descuentoTotal.toFixed(2)}`;
            document.getElementById("cart-total").innerText = `$U ${totalPagar.toFixed(2)}`;
        }

        function eliminarItemCarrito(index) {
            let carrito = JSON.parse(localStorage.getItem("minipos_carrito")) || [];
            carrito.splice(index, 1);
            localStorage.setItem("minipos_carrito", JSON.stringify(carrito));
            renderCart();
        }

        function renderCatalogoRapido() {
            let filtro = document.getElementById("input-buscar-articulo") ? document.getElementById("input-buscar-articulo").value.toLowerCase() : "";
            let articulos = JSON.parse(localStorage.getItem("minipos_articulos")) || [];
            let grid = document.getElementById("product-grid");
            if (!grid) return;
            grid.innerHTML = "";

            let filtrados = articulos.filter(art => art.codigo.toString().includes(filtro) || art.nombre.toLowerCase().includes(filtro)).slice(0, 3);

            filtrados.forEach(art => {
                grid.innerHTML += `
                    <div class="col">
                        <div class="card shadow-sm border-0" onclick="agregarAlCarrito(${art.codigo})" style="cursor: pointer;">
                            <div class="card-body py-2 d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-secondary">Cód: ${art.codigo}</span>
                                    <span class="badge bg-success" style="font-size:0.65rem;">${art.categoria}</span>
                                    <h6 class="mb-0 fw-bold text-dark mt-1 small">${art.nombre}</h6>
                                </div>
                                <span class="text-success fw-bold">$U ${parseFloat(art.precio).toFixed(2)}</span>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function filtrarCatalogoRapido() {
            renderCatalogoRapido();
        }

        function guardarEnBaseDatos() {
            let codigo = document.getElementById("db-code").value;
            let nombre = document.getElementById("db-name").value;
            let precio = document.getElementById("db-price").value;
            let categoria = document.getElementById("db-cat").value;

            if (!codigo || !nombre || !precio) {
                alert("Por favor complete todos los campos.");
                return;
            }

            let articulos = JSON.parse(localStorage.getItem("minipos_articulos")) || [];
            let index = articulos.findIndex(art => art.codigo == codigo);

            if (index > -1) {
                articulos[index].nombre = nombre;
                articulos[index].precio = parseFloat(precio).toFixed(2);
                articulos[index].categoria = categoria;
            } else {
                articulos.push({
                    codigo: parseInt(codigo),
                    nombre: nombre,
                    categoria: categoria,
                    precio: parseFloat(precio).toFixed(2)
                });
            }

            localStorage.setItem("minipos_articulos", JSON.stringify(articulos));
            document.getElementById("db-code").value = "";
            document.getElementById("db-name").value = "";
            document.getElementById("db-price").value = "";
            renderCatalogoRapido();
            alert("Artículo guardado con éxito.");
        }

        function switchTab(tab) {
            if (tab === 'pos') {
                document.getElementById('view-pos').style.display = 'flex';
                document.getElementById('view-dashboard').style.display = 'none';
                renderCatalogoRapido();
            }
        }

        function verAdmin() {
            document.getElementById('view-pos').style.display = 'none';
            document.getElementById('view-dashboard').style.display = 'flex';
        }

        function cobrarVenta() {
            let carrito = JSON.parse(localStorage.getItem("minipos_carrito")) || [];
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            alert("¡Venta cobrada con éxito!");
            localStorage.removeItem("minipos_carrito");
            renderCart();
        }
    </script>
</body>
                        </html>
